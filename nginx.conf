# nginx.conf
#
# Configuração de produção do contêiner que serve o site estático.
#
# Existe por um motivo só: `absolute_redirect off`. O TLS termina no proxy
# do EasyPanel, então o nginx daqui recebe a requisição como HTTP e, ao
# redirecionar um diretório sem barra final, monta um `Location` absoluto
# começando em `http://`. O navegador então faz um salto a mais e passa
# por HTTP puro no meio. Com o redirect relativo, o esquema que o
# navegador já estava usando é preservado.

server {
    listen 80;
    # A imagem oficial adiciona o listener IPv6 por um script de entrada
    # que só roda se o md5 do default.conf ainda for o do pacote. Como
    # este arquivo substitui aquele, o script desiste em silêncio, então
    # o listener precisa ser declarado aqui.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # Compressão de texto. Independente do bloco `location /` abaixo — não
    # mexe em redirect nem em resolução de diretório, só reduz o corpo da
    # resposta antes de sair pela rede.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/xml text/xml image/svg+xml font/woff2;

    # Sem `try_files` de propósito. Com ele, o nginx resolveria o
    # diretório internamente e serviria /sobre com 200, sem redirect
    # nenhum, o que deixaria a mesma página em duas URLs e tornaria o
    # `absolute_redirect off` acima configuração morta. Deixando o
    # tratamento padrão de diretório agir, o 301 acontece e agora sai
    # relativo, que é exatamente o que este arquivo existe para corrigir.
    location / {
    }

    # Cache longo só nos assets com hash no nome (gerados pelo build do
    # Astro em /_astro/): o hash já muda sozinho quando o conteúdo muda,
    # então "immutable" é seguro aqui. Não é `location /` nem herda o
    # comportamento dele — é um location mais específico, resolvido à
    # parte, sem afetar o redirect de diretório tratado acima.
    location ~* \.(?:css|js|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
