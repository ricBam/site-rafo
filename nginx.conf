# nginx.conf
#
# Configuração de produção do contêiner que serve o site estático.
#
# Existe por um motivo só: `absolute_redirect off`. O TLS termina no proxy
# do EasyPanel, então o nginx daqui recebe a requisição como HTTP e, ao
# redirecionar um diretório sem barra final, monta um `Location` absoluto
# começando em `http://`. O navegador então faz um salto a mais e passa
# por HTTP puro no meio. Com o redirect relativo, o esquema que o
# navegador já estava usando é preservado.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
